plugins {
    id "net.fabricmc.fabric-loom" version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    // JUnit 5 单测链路（M1 起放引擎用例）
    testImplementation platform("org.junit:junit-bom:5.11.4")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

loom {
    runs {
        client {
            client()
            name = "Instance Mover Client"
            runDir = "run"
        }
    }
}

def expandedModVersion = version.toString()

processResources {
    filteringCharset = "UTF-8"
    inputs.property "version", expandedModVersion

    filesMatching("fabric.mod.json") {
        expand "version": expandedModVersion
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = "UTF-8"
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.named("test") {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
}

// 本机环境补丁：Java 对系统 TEMP 的可写性检查在该环境下失败（Files.isWritable=false），
// 导致 JUnit 的 @TempDir 无法创建目录。把测试 JVM 的临时目录指到工作区内即可。
tasks.named("test") {
    // 某些受限环境下，Java 对系统临时目录的可写性检查会失败（Files.isWritable=false），
    // 导致 JUnit 的 @TempDir 无法创建目录。此时把测试 JVM 的临时目录改到工作区内；
    // 正常环境下这一行不会生效。
    def sysTmp = System.getProperty("java.io.tmpdir")
    if (sysTmp == null || !java.nio.file.Files.isWritable(java.nio.file.Path.of(sysTmp))) {
        def testTmp = layout.projectDirectory.dir(".tmp/junittmp").asFile
        doFirst { testTmp.mkdirs() }
        jvmArgs "-Djava.io.tmpdir=${testTmp.absolutePath.replace('\\', '/')}"
    }
}
