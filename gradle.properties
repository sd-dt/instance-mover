# 构建用 JDK 25（Minecraft 26.2 最低要求 Java 25）。
# 本文件为公开发布版本：开发机专有的 org.gradle.java.home 与代理配置已移除。
# 需要时请在本机自行添加，例如：
#   org.gradle.java.home=C:/path/to/jdk-25
#   systemProp.https.proxyHost=127.0.0.1
#   systemProp.https.proxyPort=7897

org.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.configuration-cache=false

# 版本组合（在 Minecraft 26.2 + Fabric Loader 0.19.5 上实测通过）
minecraft_version=26.2
loader_version=0.19.5
loom_version=1.17.21
fabric_api_version=0.159.0+26.2

mod_version=1.0.0
maven_group=dev.sd_dt
archives_base_name=instance-mover-fabric-26.2
